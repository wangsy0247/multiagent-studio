worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    # 上游服务定义
    upstream app_service {
        server app:8000;
    }

    upstream harness_service {
        server harness:8001;
    }

    server {
        listen 80;
        server_name localhost;

        # CORS 由各后端服务 (app/harness) 统一处理，nginx 层不再重复设置

        # ===== 前端静态资源 / Next.js =====
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ===== App 服务 API =====
        location /api/ {
            proxy_pass http://app_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
        }

        # ===== SSE 执行端点 (特殊代理配置) =====
        location /api/execute {
            proxy_pass http://app_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SSE 关键配置: 关闭缓冲
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding on;

            # 禁用 gzip (SSE 需要原始流)
            gzip off;
        }

        # ===== Harness 直出已关闭 (安全) =====
        # harness(8001) 的 execute/stop/threads 端点无鉴权、user_id 由请求方自报,
        # 经 nginx 直出等于完全绕过 app 层鉴权, 只允许 app 服务内网访问。
        # 调试需要时请在本机直接访问 127.0.0.1:8001。

        # ===== Langfuse UI (自托管) =====
        location /langfuse/ {
            rewrite ^/langfuse/(.*)$ /$1 break;
            proxy_pass http://langfuse:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
