config_version: 1

# --- Tool Groups ---
tool_groups:
  - name: search
    description: 搜索工具组
  - name: files
    description: 文件操作工具组
  - name: files_readonly
    description: 文件只读工具组
  - name: code
    description: 代码执行工具组
  - name: mcp
    description: MCP 外部工具 (动态加载)
  - name: projects
    description: 项目只读工具组 (单 agent 项目感知 — project_info / project_memory_search)

# --- Lead Agent ---
lead_agent:
  tools:
    - search
    - files
    - files_readonly
    - code
    - mcp
    - projects

# --- Tools Configuration ---
# Tools are loaded dynamically from the specified module path.
# Format: use: module.path:variable_name
# To disable a built-in tool, simply remove or comment out its entry.
tools:
  - name: web_search
    group: search
    use: harness.tools.search:web_search

  - name: arxiv_search
    group: search
    use: harness.tools.search:arxiv_search

  - name: web_fetch
    group: search
    use: harness.tools.fetchurl:web_fetch

  - name: paper_download
    group: search
    use: harness.tools.search:paper_download

  - name: bash
    group: code
    use: harness.tools.sandbox_tools:bash

  - name: file_read
    group: files_readonly
    use: harness.tools.sandbox_tools:file_read

  - name: file_write
    group: files
    use: harness.tools.sandbox_tools:file_write

  - name: list_files
    group: files_readonly
    use: harness.tools.sandbox_tools:list_files

  - name: glob_tool
    group: files_readonly
    use: harness.tools.sandbox_tools:glob_tool

  - name: grep_tool
    group: files_readonly
    use: harness.tools.sandbox_tools:grep_tool

  - name: str_replace
    group: files
    use: harness.tools.sandbox_tools:str_replace

  # ── 项目只读工具 (单 agent 项目感知, 严格只读; 不影响 Team 模式工具白名单) ──
  - name: project_info
    group: projects
    use: harness.tools.builtins.project_tools:project_info

  - name: project_memory_search
    group: projects
    use: harness.tools.builtins.project_tools:project_memory_search


# --- Sandbox ---
sandbox:
  # Sandbox provider (harness-style). Leave empty to use LocalSandboxProvider.
  # Available providers:
  #   - harness.services.local_sandbox_provider:LocalSandboxProvider  (default, zero-dependency)
  #   - harness.services.open_sandbox_provider:OpenSandboxProvider    (Docker isolation, requires sandbox server)
  use: harness.services.local_sandbox_provider:LocalSandboxProvider

  # Sandbox base image (used by OpenSandbox).
  image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/python:3.12

  # OpenSandbox settings.
  server_url: http://localhost:8080
  # api_key: ${SANDBOX_API_KEY:-multiagent-studio}
  resource_cpu: "1"
  resource_memory: "2Gi"
  timeout_minutes: 30

  allow_host_bash: false
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000

# --- Memory ---
memory:
  enabled: True
  backend: file                 # ← file 模式：DynamicContextMiddleware 用 memory.json 被动注入
  debounce_seconds: 120
  # ── file backend 配置 ──
  max_facts: 30
  fact_confidence_threshold: 0.9
  injection_enabled: true
  max_injection_tokens: 1000

# --- Summarization ---
summarization:
  enabled: True
  trigger:
    - type: fraction
      value: 0.7
    - type: messages
      value: 100
  keep:
    type: tokens
    value: 10000
  # fraction 触发/保留的换算基数: 模型最大输入 token 数
  # (自定义模型不在 langchain 内置 profile 表, 必须显式给出)
  max_input_tokens: 128000

# --- Title ---
title:
  enabled: true

# --- Loop Detection ---
loop_detection:
  warn_threshold: 3       # Layer 1: 相同调用集触发警告
  hard_limit: 5            # Layer 1: 相同调用集强制停止
  tool_freq_warn: 20       # Layer 2: 同工具名触发警告
  tool_freq_hard_limit: 30 # Layer 2: 同工具名强制停止
  window_size: 35

# --- Tool Search (MCP 工具延迟加载, harness-aligned) ---
# 启用后 MCP 工具只暴露名字, 完整 schema 由模型通过 tool_search 工具按需加载;
# promoted 记录存图状态 (merge_promoted_tools reducer), catalog_hash 漂移自动失效
tool_search:
  enabled: true
  defer_threshold: 10      # MCP 工具总数 ≥ 此值才启用延迟加载
  max_results: 5           # tool_search 单次最多返回的完整 schema 数

# --- Subagents ---
subagents:
  timeout_seconds: 900

# --- Git Worktree Isolation ---
worktree:
  enabled: true
  auto_init: true               # Auto git init non-git workspace
  symlink_deps: [".venv", "node_modules", "__pycache__"]
  keep_on_conflict: true        # Preserve worktree on merge conflict
  cleanup_stale_on_start: true  # Remove stale worktrees at startup

# --- Checkpointer (conversation state persistence) ---
# backend: memory | sqlite | postgres
# sqlite_dir 为空时自动使用 data_root+/data/（即 ~/.multiagent-studio/data/app.db）
checkpointer:
  backend: sqlite
  sqlite_dir: ""           # 空 = 使用 Paths.data_dir
  postgres_url: ""

# --- Database (application-level persistence: runs/threads/events) ---
# 与 checkpointer 共享同一个 app.db 文件
database:
  backend: sqlite
  sqlite_dir: ""           # 空 = 使用 Paths.data_dir
  postgres_url: ""

# --- Uploads ---
uploads:
  max_files: 10
  max_file_size: 52428800
  max_total_size: 104857600

langfuse_enabled: true
langfuse_public_key: ${LANGFUSE_PUBLIC_KEY}
langfuse_secret_key: ${LANGFUSE_SECRET_KEY}
langfuse_host: ${LANGFUSE_HOST}

# MCP server 定义见项目根目录 extensions_config.json
