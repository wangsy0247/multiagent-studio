version: "3.8"

services:
  harness:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HARNESS_PORT:-8001}:8001"
    environment:
      - HARNESS_OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - HARNESS_OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - HARNESS_LANGFUSE_ENABLED=${LANGFUSE_ENABLED:-false}
      - HARNESS_LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - HARNESS_LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - HARNESS_LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
      - HARNESS_MCP_CONFIG_PATH=${MCP_CONFIG_PATH:-./extensions_config.json}
    volumes:
      - ./workspace:/app/workspace
      - ./memory:/app/memory
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - harness-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - harness-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harness}
      POSTGRES_DB: harness
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - harness-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  harness-network:
    driver: bridge
