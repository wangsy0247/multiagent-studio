config_version: 1

# --- Models (same pattern as DeerFlow) ---
# models:
#   - name: gpt-4o
#     display_name: GPT-4o
#     use: langchain_openai:ChatOpenAI
#     model: gpt-4o
#     api_key: $OPENAI_API_KEY
#     temperature: 0.7
#     max_tokens: 4096
#     supports_vision: true

# --- Tool Groups ---
tool_groups:
  - name: search
    description: 搜索工具组
  - name: code
    description: 代码执行工具组
  - name: files
    description: 文件操作工具组
  - name: data
    description: 数据分析工具组
  - name: abacus
    description: Abacus 材料计算工具组
  - name: weather
    description: 天气查询工具组

# --- Tools Configuration ---
# Tools are loaded dynamically from the specified module path.
# Format: use: module.path:variable_name
# To disable a built-in tool, simply remove or comment out its entry.
tools:
  - name: web_search
    group: search
    use: harness.tools.search:web_search

  - name: arxiv_search
    group: search
    use: harness.tools.search:arxiv_search

  - name: bash
    group: code
    use: harness.tools.sandbox_tools:bash

  - name: file_read
    group: files
    use: harness.tools.sandbox_tools:file_read

  - name: file_write
    group: files
    use: harness.tools.sandbox_tools:file_write

  - name: list_files
    group: files
    use: harness.tools.sandbox_tools:list_files

  - name: glob_tool
    group: files
    use: harness.tools.sandbox_tools:glob_tool

  - name: grep_tool
    group: files
    use: harness.tools.sandbox_tools:grep_tool

  - name: str_replace
    group: files
    use: harness.tools.sandbox_tools:str_replace

  - name: generate_abacus_input
    group: abacus
    use: harness.tools.abacus:generate_abacus_input

  - name: submit_abacus_job
    group: abacus
    use: harness.tools.abacus:submit_abacus_job

  - name: weather_search
    group: weather
    use: harness.tools.weather:weather_search

  - name: code_check
    group: code
    use: harness.tools.core:code_check


# --- Sandbox ---
sandbox:
  # Sandbox provider (DeerFlow-style). Leave empty to use LocalSandboxProvider.
  # use: harness.services.docker_sandbox_provider:DockerSandboxProvider
  use: harness.services.docker_sandbox_provider:DockerSandboxProvider
  allow_host_bash: false
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000
  # mounts:
  #   - host_path: /home/user/data
  #     container_path: /mnt/data
  #     read_only: true

# --- Memory ---
memory:
  enabled: True
  storage_path: memory.json
  debounce_seconds: 30
  max_facts: 100
  fact_confidence_threshold: 0.7
  injection_enabled: true
  max_injection_tokens: 2000

# --- Summarization ---
summarization:
  enabled: True
  trigger:
    - type: tokens
      value: 32000
  keep:
    type: messages
    value: 10

# --- Title ---
title:
  enabled: True
  max_words: 6
  max_chars: 60

# --- Loop Detection ---
loop_detection:
  enabled: true
  warn_threshold: 3
  hard_limit: 5
  window_size: 20

# --- Subagents ---
subagents:
  timeout_seconds: 900

# --- Checkpointer (conversation state persistence) ---
# backend: memory | sqlite | postgres
# sqlite_dir 为空时自动使用 data_root+/data/（即 ~/.multiagent-studio/data/deerflow.db）
checkpointer:
  backend: sqlite
  sqlite_dir: ""           # 空 = 使用 Paths.data_dir
  postgres_url: ""

# --- Database (application-level persistence: runs/threads/events) ---
# 与 checkpointer 共享同一个 deerflow.db 文件
database:
  backend: sqlite
  sqlite_dir: ""           # 空 = 使用 Paths.data_dir
  postgres_url: ""

# --- Uploads ---
uploads:
  max_files: 10
  max_file_size: 52428800
  max_total_size: 104857600

