config_version: 1

# --- Models (same pattern as DeerFlow) ---
# models:
#   - name: gpt-4o
#     display_name: GPT-4o
#     use: langchain_openai:ChatOpenAI
#     model: gpt-4o
#     api_key: $OPENAI_API_KEY
#     temperature: 0.7
#     max_tokens: 4096
#     supports_vision: true

# --- Tool Groups ---
tool_groups:
  - name: search
    description: 搜索工具组
  # - name: code
  #   description: 代码执行工具组
  - name: files
    description: 文件操作工具组
  - name: files_readonly
    description: 文件只读工具组
  - name: mcp
    description: MCP 外部工具 (动态加载)

# --- Lead Agent ---
lead_agent:
  tools:
    - search
    - files
    - files_readonly
    - skills
    - mcp

# --- Tools Configuration ---
# Tools are loaded dynamically from the specified module path.
# Format: use: module.path:variable_name
# To disable a built-in tool, simply remove or comment out its entry.
tools:
  - name: web_search
    group: search
    use: harness.tools.search:web_search

  - name: arxiv_search
    group: search
    use: harness.tools.search:arxiv_search

  # - name: web_fetch
  #   group: search
  #   use: harness.tools.search:web_fetch

  # - name: web_fetch
  #   group: search
  #   use: harness.tools.serpapi_fetch:web_fetch

  - name: web_fetch
    group: search
    use: harness.tools.fetchurl:web_fetch

  - name: paper_download
    group: search
    use: harness.tools.search:paper_download

  - name: bash
    group: code
    use: harness.tools.sandbox_tools:bash

  - name: file_read
    group: files_readonly
    use: harness.tools.sandbox_tools:file_read

  - name: file_write
    group: files
    use: harness.tools.sandbox_tools:file_write

  - name: list_files
    group: files_readonly
    use: harness.tools.sandbox_tools:list_files

  - name: glob_tool
    group: files_readonly
    use: harness.tools.sandbox_tools:glob_tool

  - name: grep_tool
    group: files_readonly
    use: harness.tools.sandbox_tools:grep_tool

  - name: str_replace
    group: files
    use: harness.tools.sandbox_tools:str_replace


# --- Sandbox ---
sandbox:
  # Sandbox provider (DeerFlow-style). Leave empty to use LocalSandboxProvider.
  # Available providers:
  #   - harness.services.open_sandbox_provider:OpenSandboxProvider  (recommended)
  #   - harness.services.local_sandbox_provider:LocalSandboxProvider
  use: harness.services.open_sandbox_provider:OpenSandboxProvider

  # Sandbox base image (used by OpenSandbox).
  image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/python:3.12

  # OpenSandbox settings.
  server_url: http://localhost:8080
  api_key: "multiagent-studio"
  resource_cpu: "1"
  resource_memory: "2Gi"
  timeout_minutes: 30

  allow_host_bash: false
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000
  # mounts:
  #   - host_path: /home/user/data
  #     container_path: /mnt/data
  #     read_only: true

# --- Memory ---
memory:
  enabled: True
  backend: file                 # ← file 模式：DynamicContextMiddleware 用 memory.json 被动注入
  debounce_seconds: 120
  # ── file backend 配置 ──
  max_facts: 10
  fact_confidence_threshold: 0.9
  injection_enabled: true
  max_injection_tokens: 500
  # ── mem0 工具配置（与 backend 独立）──
  mem0_tool_enabled: true       # ← 启用 memory_search 工具
  mem0_search_top_k: 5          # 工具查询的 top_k（精准查询不需要太多）
  # ── 以下 mem0 配置在写入路径和工具查询时使用 ──
  mem0_config:
    vector_store:
      provider: pgvector
      config:
        dbname: multiagent_studio
        collection_name: memories
        embedding_model_dims: 1024   # text-embedding-v4 = 2560 维
        user: harness
        password: harness
        host: localhost
        port: 5432
        hnsw: true
    llm:
      provider: openai
      config:
        model: qwen3.6-plus
        openai_base_url: ${HARNESS_OPENAI_BASE_URL}
        api_key: ${HARNESS_OPENAI_API_KEY}
    embedder:
      provider: openai
      config:
        model: text-embedding-v4
        openai_base_url: ${DASHSCOPE_EMBEDDING_BASE_URL}
        api_key: ${DASHSCOPE_API_KEY}

# --- Summarization ---
summarization:
  enabled: True
  trigger:
    - type: tokens
      value: 20000
  keep:
    type: messages
    value: 10

# --- Title ---
title:
  enabled: true

# --- Loop Detection ---
loop_detection:
  enabled: true
  warn_threshold: 3       # Layer 1: 相同调用集触发警告
  hard_limit: 5            # Layer 1: 相同调用集强制停止
  tool_freq_warn: 20       # Layer 2: 同工具名触发警告
  tool_freq_hard_limit: 40 # Layer 2: 同工具名强制停止
  window_size: 20

# --- Subagents ---
subagents:
  timeout_seconds: 900

# --- Checkpointer (conversation state persistence) ---
# backend: memory | sqlite | postgres
# sqlite_dir 为空时自动使用 data_root+/data/（即 ~/.multiagent-studio/data/deerflow.db）
checkpointer:
  backend: sqlite
  sqlite_dir: ""           # 空 = 使用 Paths.data_dir
  postgres_url: ""

# --- Database (application-level persistence: runs/threads/events) ---
# 与 checkpointer 共享同一个 deerflow.db 文件
database:
  backend: sqlite
  sqlite_dir: ""           # 空 = 使用 Paths.data_dir
  postgres_url: ""

# --- Uploads ---
uploads:
  max_files: 10
  max_file_size: 52428800
  max_total_size: 104857600

