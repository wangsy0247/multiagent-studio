# 可选基础设施: PostgreSQL (替代默认 SQLite) + Redis
# 默认配置下无需启动 — 只有 .env 配置了 DATABASE_URL 指向 PostgreSQL 时才需要
version: "3.3"

services:
  # ===== PostgreSQL =====
  postgres:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-harness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harness}
      POSTGRES_DB: ${POSTGRES_DB:-multiagent_studio}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d multiagent_studio"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - workbench
    restart: unless-stopped

  # ===== Redis =====
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - workbench
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  workbench:
    driver: bridge
