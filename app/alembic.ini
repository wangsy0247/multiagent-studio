[alembic]
script_location = db/migrations
prepend_sys_path = .
# 从环境变量读取; 默认值仅用于本地开发
sqlalchemy.url = ${DATABASE_URL_SYNC:-postgresql://user:password@localhost:5432/multiagent_studio}

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
